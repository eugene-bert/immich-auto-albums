{{define "rule-form"}}
<article>
    <header>
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>{{if .ID}}Edit Rule{{else}}New Rule{{end}}</strong>
            <button class="secondary outline" onclick="document.getElementById('rule-form-container').innerHTML=''">&times;</button>
        </div>
    </header>
    <form {{if .ID}}hx-put="/rules/{{.ID}}"{{else}}hx-post="/rules"{{end}}
          hx-target="{{if .ID}}#rule-{{.ID}}{{else}}#rules-list{{end}}"
          hx-swap="{{if .ID}}outerHTML{{else}}beforeend{{end}}"
          hx-on::after-request="document.getElementById('rule-form-container').innerHTML=''">
        <div class="grid">
            <label>Name <input type="text" name="name" value="{{.Name}}" required></label>
            <label>Album Name <input type="text" name="album_name" value="{{.AlbumName}}" required></label>
        </div>
        <details>
            <summary>Camera Filters</summary>
            <div class="grid">
                <label>Camera Make <input type="text" name="camera_make" value="{{.CameraMake}}" placeholder="e.g. FUJIFILM"></label>
                <label>Camera Model <input type="text" name="camera_model" value="{{.CameraModel}}" placeholder="e.g. X-E5"></label>
                <label>Lens Model <input type="text" name="lens_model" value="{{.LensModel}}" placeholder="e.g. XF23mmF1.4"></label>
            </div>
        </details>
        <details>
            <summary>Location Filters</summary>
            <div class="grid">
                <label>City <input type="text" name="city" value="{{.City}}"></label>
                <label>State <input type="text" name="state" value="{{.State}}"></label>
                <label>Country <input type="text" name="country" value="{{.Country}}"></label>
            </div>
        </details>
        <details>
            <summary>Other Filters</summary>
            <div class="grid">
                <label>Media Type
                    <select name="media_type">
                        <option value="" {{if eq .MediaType ""}}selected{{end}}>All</option>
                        <option value="IMAGE" {{if eq .MediaType "IMAGE"}}selected{{end}}>Images</option>
                        <option value="VIDEO" {{if eq .MediaType "VIDEO"}}selected{{end}}>Videos</option>
                    </select>
                </label>
                <label>Taken After <input type="date" name="taken_after" value="{{.TakenAfter}}"></label>
                <label>Taken Before <input type="date" name="taken_before" value="{{.TakenBefore}}"></label>
            </div>
        </details>
        <div class="grid">
            <label>Sync Interval (seconds) <input type="number" name="interval" value="{{if .Interval}}{{.Interval}}{{else}}3600{{end}}" min="60"></label>
            <label>
                <input type="checkbox" name="enabled" value="1" {{if or (not .ID) .Enabled}}checked{{end}}>
                Enabled
            </label>
        </div>
        <button type="submit">{{if .ID}}Update{{else}}Create{{end}}</button>
    </form>
</article>
{{end}}
