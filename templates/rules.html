{{define "content"}}
<div style="display:flex;justify-content:space-between;align-items:center;">
    <h2>Rules</h2>
    <button hx-get="/rules/new" hx-target="#rule-form-container" hx-swap="innerHTML">+ New Rule</button>
</div>
<div id="rule-form-container"></div>
<div id="rules-list">
    {{range .Rules}}
    {{template "rule-row" .}}
    {{else}}
    <p>No rules yet. Create one to start auto-sorting your Immich library.</p>
    {{end}}
</div>
{{end}}
